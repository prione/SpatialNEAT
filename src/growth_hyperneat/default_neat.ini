[NEAT]
pop_size = 12
fitness_criterion = max
fitness_threshold = 0.0
reset_on_extinction = False
no_fitness_termination = True

[DefaultGenome]
# 3D default: source xyz, target xyz, distance, bias. Loader also supports 2D.
num_inputs = 8
num_outputs = 1
num_hidden = 0
feed_forward = True
initial_connection = full_direct
activation_default = tanh
activation_options = tanh sin gauss identity
activation_mutate_rate = 0.05
aggregation_default = sum
aggregation_options = sum
aggregation_mutate_rate = 0.0
bias_init_mean = 0.0
bias_init_stdev = 0.2
bias_init_type = gaussian
bias_max_value = 4.0
bias_min_value = -4.0
bias_mutate_power = 0.12
bias_mutate_rate = 0.15
bias_replace_rate = 0.02
response_init_mean = 1.0
response_init_stdev = 0.0
response_init_type = gaussian
response_max_value = 1.0
response_min_value = 1.0
response_mutate_power = 0.0
response_mutate_rate = 0.0
response_replace_rate = 0.0
weight_init_mean = 0.0
weight_init_stdev = 0.3
weight_init_type = gaussian
weight_max_value = 4.0
weight_min_value = -4.0
weight_mutate_power = 0.12
weight_mutate_rate = 0.15
weight_replace_rate = 0.02
enabled_default = True
enabled_mutate_rate = 0.01
enabled_rate_to_true_add = 0.0
enabled_rate_to_false_add = 0.0
compatibility_disjoint_coefficient = 1.0
compatibility_weight_coefficient = 0.5
conn_add_prob = 0.1
conn_delete_prob = 0.03
node_add_prob = 0.1
node_delete_prob = 0.02
single_structural_mutation = True
structural_mutation_surer = True

[DefaultSpeciesSet]
compatibility_threshold = 3.0

[DefaultStagnation]
species_fitness_func = max
max_stagnation = 15
species_elitism = 1

[DefaultReproduction]
elitism = 1
survival_threshold = 0.5
min_species_size = 2
