[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-neat"
version = "0.3.1"
description = "2D/3D ES-HyperNEAT and recurrent networks with optional structural development"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "neat-python==0.92"]

[project.urls]
Repository = "https://github.com/prione/SpatialNEAT"
Issues = "https://github.com/prione/SpatialNEAT/issues"

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff>=0.9", "build"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
spatial_neat = ["default_neat.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
